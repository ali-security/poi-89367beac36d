# Seal build for Apache POI 3.15 (poi-ooxml jar).
# Upstream ships no GitHub Actions CI; this workflow mirrors the project's own
# Ant build (build.xml `test` + `test-ooxml-lite` + `jar`, as run by its
# `dist`/`jenkins` targets) on the toolchain the release used: JDK 6 + Ant 1.9.4.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Test class name pattern (build.xml testpattern, e.g. TestXSSFWorkbook); empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ZULU6_URL: https://cdn.azul.com/zulu/bin/zulu6.22.0.3-ca-jdk6.0.119-linux_x64.tar.gz
      ZULU6_SHA256: dd4765b45d9f1fc319a6e5be0bbc79371582daa8fd77872d51072f16deca2625
      ANT_URL: https://archive.apache.org/dist/ant/binaries/apache-ant-1.9.4-bin.tar.gz
      ANT_SHA256: 66d3edcbb0eba11387705cd89178ffb65e55cd53f13ca35c1bb983c0f9992540
      # The ECMA-376 / ETSI XSD download URLs in build.xml are dead (404/403), so the
      # XSD fetch is skipped and the compiled schema jars poi-ooxml 3.15 depends on
      # (org.apache.poi:ooxml-schemas:1.3, ooxml-security:1.1) come from Maven Central.
      ANT_ARGS_COMMON: -Dooxml-xsds.present=true
    steps:
      - uses: actions/checkout@v4

      # JDK 8 is used ONLY to download third-party jars: JDK 6's TLS stack cannot
      # handshake with https://repo1.maven.org any more.
      - name: Set up JDK 8 (dependency download only)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install JDK 6 (Zulu 6u119) and Ant 1.9.4
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL -o zulu6.tar.gz "$ZULU6_URL"
          echo "$ZULU6_SHA256  zulu6.tar.gz" | sha256sum -c -
          tar xzf zulu6.tar.gz
          curl -fsSL -o ant.tar.gz "$ANT_URL"
          echo "$ANT_SHA256  ant.tar.gz" | sha256sum -c -
          tar xzf ant.tar.gz
          # build.xml uses <scriptdef language="javascript">; OpenJDK 6 ships no JS
          # engine, so give Ant BSF 2.4 + Rhino (Ant's ant-apache-bsf is bundled).
          for a in bsf/bsf/2.4.0/bsf-2.4.0.jar \
                   org/mozilla/rhino/1.7R4/rhino-1.7R4.jar \
                   commons-logging/commons-logging/1.2/commons-logging-1.2.jar; do
            curl -fsSL -o "apache-ant-1.9.4/lib/$(basename "$a")" "https://repo1.maven.org/maven2/$a"
          done
          echo "JDK6_HOME=$RUNNER_TEMP/tools/zulu6.22.0.3-jdk6.0.119-linux_x64" >> "$GITHUB_ENV"
          echo "JDK8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANT_HOME=$RUNNER_TEMP/tools/apache-ant-1.9.4" >> "$GITHUB_ENV"

      - name: Fetch build dependencies (build.xml fetch-jars / fetch-ooxml-jars)
        run: |
          set -euo pipefail
          JAVA_HOME="$JDK8_HOME" "$ANT_HOME/bin/ant" $ANT_ARGS_COMMON fetch-jars fetch-ooxml-jars
          cd ooxml-lib
          for a in ooxml-schemas/1.3/ooxml-schemas-1.3 ooxml-schemas/1.3/ooxml-schemas-1.3-sources \
                   ooxml-security/1.1/ooxml-security-1.1 ooxml-security/1.1/ooxml-security-1.1-sources; do
            curl -fsSL -O "https://repo1.maven.org/maven2/org/apache/poi/$a.jar"
          done
          ls -la ../lib ../compile-lib .

      # TestSignatureInfo.testSignEnvelopingDocument probes http://timestamp.comodoca.com/rfc3161
      # and falls back to its own mock time-stamp service when the host is unreachable. The live
      # service is reachable but now rejects the request (status 2), which turns the test into an
      # Assume-skip; make the host unreachable so the test runs its offline (mock TSP) path.
      - name: Route the retired comodoca TSP host to localhost
        run: echo "127.0.0.1 timestamp.comodoca.com" | sudo tee -a /etc/hosts

      - name: Test (ant test - main, scratchpad, ooxml, excelant)
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$JDK6_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          if [ -n "${{ inputs.test-filter }}" ]; then
            "$ANT_HOME/bin/ant" $ANT_ARGS_COMMON -Dtestpattern=${{ inputs.test-filter }} test
          else
            "$ANT_HOME/bin/ant" $ANT_ARGS_COMMON test
          fi

      - name: Test summary (ant test)
        if: always()
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/seal-test-summary.py" build/test-results build/scratchpad-test-results build/ooxml-test-results build/excelant-test-results

      - name: Build jars (ant test-ooxml-lite jar)
        run: |
          set -euo pipefail
          export JAVA_HOME="$JDK6_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
          if [ -n "${{ inputs.test-filter }}" ]; then
            "$ANT_HOME/bin/ant" $ANT_ARGS_COMMON jar
          else
            # test-ooxml-lite re-runs the OOXML suite against the generated poi-ooxml-schemas jar
            "$ANT_HOME/bin/ant" $ANT_ARGS_COMMON test-ooxml-lite jar
          fi
          ls -la build/dist/maven/*/

      - name: Test summary (ant test-ooxml-lite)
        if: always() && inputs.test-filter == ''
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/seal-test-summary.py" build/ooxml-test-results

      - name: Upload poi-ooxml jar
        uses: actions/upload-artifact@v4
        with:
          name: poi-ooxml-3.15
          path: build/dist/maven/poi-ooxml/poi-ooxml-3.15.jar
          if-no-files-found: error
